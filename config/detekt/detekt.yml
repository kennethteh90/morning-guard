build:
  maxIssues: 0

config:
  validation: true

complexity:
  LongMethod:
    active: true
    threshold: 80
    excludes:
      - "**/ui/**"
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    excludes:
      - "**/ui/**"
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 12
  TooManyFunctions:
    active: true
    excludes:
      - "**/*ViewModel.kt"
      - "**/sync/**"
      - "**/di/**"
naming:
  FunctionNaming:
    active: false
  MatchingDeclarationName:
    active: false

style:
  ReturnCount:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludes:
      - "**/ui/**"

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
