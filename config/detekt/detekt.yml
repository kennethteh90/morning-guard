build:
  maxIssues: 0

config:
  validation: true

complexity:
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    active: true
    functionThreshold: 10
naming:
  FunctionNaming:
    active: false
  MatchingDeclarationName:
    active: false

style:
  ReturnCount:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 120

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
