name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace

      - name: Read version
        id: version
        run: |
          VERSION=$(grep versionMajor version.properties | cut -d= -f2).$(grep versionMinor version.properties | cut -d= -f2).$(grep versionPatch version.properties | cut -d= -f2)
          echo "name=${VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Morning Guard v${{ steps.version.outputs.name }}
          body_path: CHANGELOG.md
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
