name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: cimg/android:2024.04.1
    steps:
      - uses: actions/checkout@v4

      - name: Configure Android SDK path
        run: echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Read version
        id: version
        run: |
          VERSION=$(grep versionMajor version.properties | cut -d= -f2).$(grep versionMinor version.properties | cut -d= -f2).$(grep versionPatch version.properties | cut -d= -f2)
          echo "name=${VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Morning Guard v${{ steps.version.outputs.name }}
          body_path: CHANGELOG.md
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
