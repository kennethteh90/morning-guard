name: Release

on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: Upload AAB to Play internal track (requires PLAY_SERVICE_ACCOUNT_JSON)
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - version.properties

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: cimg/android:2024.04.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release label
        id: release_label
        run: |
          set -euo pipefail
          # version.properties uses versionMajor= / versionMinor= / versionPatch=
          eval "$(grep -E '^version(Major|Minor|Patch)=' version.properties)"
          echo "label=v${versionMajor}.${versionMinor}.${versionPatch}" >> "$GITHUB_OUTPUT"

      - name: Install NDK (native debug symbol extraction)
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;27.0.12077973"

      - name: Validate release secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PRIVACY_POLICY_URL: ${{ secrets.PRIVACY_POLICY_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          BIBLE_PROXY_BASE_URL: ${{ secrets.BIBLE_PROXY_BASE_URL }}
          PLAY_CLOUD_PROJECT_NUMBER: ${{ secrets.PLAY_CLOUD_PROJECT_NUMBER }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD \
            PRIVACY_POLICY_URL SUPABASE_URL SUPABASE_ANON_KEY \
            GOOGLE_WEB_CLIENT_ID BIBLE_PROXY_BASE_URL PLAY_CLOUD_PROJECT_NUMBER; do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub Actions secrets (set via ./scripts/push-github-secrets.sh):"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/morning-guard-upload.keystore"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Configure local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          BIBLE_PROXY_BASE_URL: ${{ secrets.BIBLE_PROXY_BASE_URL }}
          PLAY_CLOUD_PROJECT_NUMBER: ${{ secrets.PLAY_CLOUD_PROJECT_NUMBER }}
          PRIVACY_POLICY_URL: ${{ secrets.PRIVACY_POLICY_URL }}
          RELEASE_STORE_FILE: ${{ env.KEYSTORE_PATH }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            [ -n "$SENTRY_DSN" ] && echo "SENTRY_DSN=$SENTRY_DSN"
            echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
            echo "BIBLE_PROXY_BASE_URL=$BIBLE_PROXY_BASE_URL"
            echo "PLAY_CLOUD_PROJECT_NUMBER=$PLAY_CLOUD_PROJECT_NUMBER"
            echo "PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL"
            echo "RELEASE_STORE_FILE=$RELEASE_STORE_FILE"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } > local.properties

      - name: Build full release App Bundle
        run: ./gradlew :app:bundleFullRelease --stacktrace

      - name: Upload App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: morning-guard-full-release-${{ steps.release_label.outputs.label }}
          path: app/build/outputs/bundle/fullRelease/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: morning-guard-r8-mapping-${{ steps.release_label.outputs.label }}
          path: app/build/outputs/mapping/fullRelease/mapping.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: morning-guard-native-symbols-${{ steps.release_label.outputs.label }}
          path: app/build/outputs/native-debug-symbols/fullRelease/**
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare Play deobfuscation artifacts
        id: play_deobfuscation
        run: |
          set -euo pipefail
          mapping="app/build/outputs/mapping/fullRelease/mapping.txt"
          native_zip="app/build/outputs/native-debug-symbols/fullRelease/native-debug-symbols.zip"
          if [ ! -f "$mapping" ]; then
            echo "mapping_file=" >> "$GITHUB_OUTPUT"
          else
            echo "mapping_file=$mapping" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$native_zip" ]; then
            echo "native_symbols=$native_zip" >> "$GITHUB_OUTPUT"
          else
            echo "native_symbols=" >> "$GITHUB_OUTPUT"
            echo "No native-debug-symbols.zip produced (dependency .so files may be pre-stripped)."
          fi

      - name: Play upload gate
        id: play_gate
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_to_play)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PLAY_SERVICE_ACCOUNT_JSON is not set; skipping Play upload."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Play release status
        id: play_release_status
        if: steps.play_gate.outputs.enabled == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "status=draft" >> "$GITHUB_OUTPUT"
          else
            echo "status=completed" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Play internal (with release notes)
        if: >-
          steps.play_gate.outputs.enabled == 'true' &&
          hashFiles('release-notes/**') != ''
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.morningguard.app
          releaseFiles: app/build/outputs/bundle/fullRelease/*.aab
          track: internal
          status: ${{ steps.play_release_status.outputs.status }}
          whatsNewDirectory: release-notes
          mappingFile: ${{ steps.play_deobfuscation.outputs.mapping_file }}
          debugSymbols: ${{ steps.play_deobfuscation.outputs.native_symbols }}

      - name: Publish Play internal
        if: >-
          steps.play_gate.outputs.enabled == 'true' &&
          hashFiles('release-notes/**') == ''
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.morningguard.app
          releaseFiles: app/build/outputs/bundle/fullRelease/*.aab
          track: internal
          status: ${{ steps.play_release_status.outputs.status }}
          mappingFile: ${{ steps.play_deobfuscation.outputs.mapping_file }}
          debugSymbols: ${{ steps.play_deobfuscation.outputs.native_symbols }}
