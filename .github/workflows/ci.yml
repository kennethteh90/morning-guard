name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: cimg/android:2024.04.1
    steps:
      - uses: actions/checkout@v7

      - name: Configure local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          BIBLE_PROXY_BASE_URL: ${{ secrets.BIBLE_PROXY_BASE_URL }}
          PLAY_CLOUD_PROJECT_NUMBER: ${{ secrets.PLAY_CLOUD_PROJECT_NUMBER }}
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            if [ -n "$SUPABASE_URL" ]; then echo "SUPABASE_URL=$SUPABASE_URL"; fi
            if [ -n "$SUPABASE_ANON_KEY" ]; then echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"; fi
            if [ -n "$SENTRY_DSN" ]; then echo "SENTRY_DSN=$SENTRY_DSN"; fi
            if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"; fi
            if [ -n "$BIBLE_PROXY_BASE_URL" ]; then echo "BIBLE_PROXY_BASE_URL=$BIBLE_PROXY_BASE_URL"; fi
            if [ -n "$PLAY_CLOUD_PROJECT_NUMBER" ]; then echo "PLAY_CLOUD_PROJECT_NUMBER=$PLAY_CLOUD_PROJECT_NUMBER"; fi
          } > local.properties

      - name: Run unit tests
        run: ./gradlew test detekt lint --stacktrace
