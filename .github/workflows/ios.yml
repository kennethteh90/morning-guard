name: iOS

# Simulator build + MorningGuardCore tests on PRs only. Tagged releases use ios-release.yml.
on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "version.properties"

concurrency:
  group: ios-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: ./scripts/generate-xcodeproj.sh

      - name: Test MorningGuardCore
        working-directory: ios/MorningGuardCore
        run: swift test

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project MorningGuard.xcodeproj \
            -scheme MorningGuard \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
